<!doctype html>
<html>
  <head>
    <title>SHT4x Monitor</title>

    <link rel="stylesheet" href="/static/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="container">
      <button id="theme">🌙 Toggle dark mode</button>

      <h1>SHT4x Sensor Monitor</h1>

      <div class="sensor-select">
        <label> Sensor: </label>

        <select id="sensorSelector"></select>
      </div>

      <div class="cards">
        <div class="card">
          <h3>Temperature</h3>

          <div class="value" id="temperature">--</div>
        </div>

        <div class="card">
          <h3>Humidity</h3>

          <div class="value" id="humidity">--</div>
        </div>

        <div class="card">
          <h3>Last update</h3>

          <div class="value small" id="lastUpdate">--</div>
        </div>
      </div>

      <div class="range-buttons">
        <button class="range active" onclick="changeRange(this, 'hour')">
          Last hour
        </button>

        <button class="range" onclick="changeRange(this, 'day')">Today</button>

        <button class="range" onclick="changeRange(this, 'week')">
          7 days
        </button>

        <button class="range" onclick="changeRange(this, 'month')">
          Month
        </button>

        <button class="range" onclick="changeRange(this, 'all')">All</button>
      </div>

      <div class="graph">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
